[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.70"
description = "Пошуковий рушій: інвертований індекс, булеві запити, BM25/TF-IDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.28.1",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: тест довший за секунду (пропустити: pytest -m 'not slow')",
]

[tool.coverage.run]
source = ["findex"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]

[tool.pyright]
include = ["src"]
exclude = ["scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501", "I001"]
[tool.ruff.lint.isort]
known-first-party = ["findex"]

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]
